name: CI

on:
  push:
    branches: [main, whisper-swift]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel
          pip install --no-build-isolation -r requirements.txt
          pip install pytest

      - name: Compile core Python modules
        run: python -m py_compile app.py routes.py whisper_core.py integrations.py llm_post.py sse.py gui.py

      - name: Run unit tests
        run: python -m pytest tests/unit -q

  integration-tests:
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel
          pip install --no-build-isolation -r requirements.txt
          pip install pytest requests

      - name: Start Flask server (WHISPER_TEST mode)
        run: |
          WHISPER_TEST=1 nohup python3 app.py > server.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:5001/api/health > /dev/null 2>&1; then
              echo "server ready"
              exit 0
            fi
            sleep 1
          done
          echo "server did not become ready in time"
          cat server.log
          exit 1

      - name: Run integration tests
        run: python -m pytest tests/integration -m integration -v

      - name: Server log (always, for debugging)
        if: always()
        run: cat server.log || true

      - name: Stop Flask server
        if: always()
        run: pkill -f "python3 app.py" || true

  bundle-dependency-check:
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel
          pip install --no-build-isolation -r requirements.txt
          pip install pyinstaller

      - name: Build unsigned bundle (no install, no codesign)
        run: python -m PyInstaller -y gui.spec

      - name: Check bundle does not contain pyannote packaging regression
        run: python3 ci/check_bundle_deps.py

  swift-tests:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build (debug)
        working-directory: macos/WhisperApp
        run: swift build -c debug --scratch-path /tmp/whisper-swift-ci

      - name: Clean scratch path xattrs (defensive, matches build_swiftui_app.sh)
        run: |
          xattr -cr /tmp/whisper-swift-ci || true
          xattr -d com.apple.FinderInfo /tmp/whisper-swift-ci 2>/dev/null || true

      - name: Run tests (excluding known-flaky LiveRecordingControllerTests)
        working-directory: macos/WhisperApp
        run: swift test --scratch-path /tmp/whisper-swift-ci --skip LiveRecordingControllerTests

      - name: Run LiveRecordingControllerTests in isolation (known flaky under parallel execution)
        working-directory: macos/WhisperApp
        run: swift test --scratch-path /tmp/whisper-swift-ci --filter LiveRecordingControllerTests

  swift-tsan:
    runs-on: macos-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run tests under Thread Sanitizer (advisory)
        working-directory: macos/WhisperApp
        run: swift test --sanitize=thread --scratch-path /tmp/whisper-swift-tsan-ci
